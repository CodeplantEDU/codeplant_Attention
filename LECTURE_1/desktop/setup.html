<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>AI 연결 준비</title><style>

</style><script defer src="setup.js"></script></head><body><main><small>CODEPLANT · ATTENTION</small><h1>사용할 AI를 선택하세요.</h1><p>터미널 명령어 없이 시작합니다. 필요한 공식 실행 도구를 이 앱 전용 폴더에 준비한 뒤, 대화 화면에서 본인 계정으로 로그인하세요.</p><form id="setup"><label><input type="checkbox" value="codex" checked>Codex · OpenAI</label><label><input type="checkbox" value="claude">Claude Code · Anthropic</label><label><input type="checkbox" value="gemini">Gemini · Google</label><button id="install">선택한 AI 준비</button><button type="button" id="open" class="secondary">대화 화면 열기</button></form><p id="status" role="status" aria-live="polite"></p><p id="notice">하나만 연결해도 사용할 수 있습니다. 처음 준비할 때는 인터넷과 다운로드 공간이 필요합니다. 계정 사용량과 각 서비스의 이용 조건이 적용됩니다.</p></main></body></html>
