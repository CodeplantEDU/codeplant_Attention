name: Desktop executables
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: desktop-v0.6.0
      runtime_run:
        description: 'Optional successful runtime build run ID (same runtime source only)'
        required: false
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  runtime:
    if: ${{ inputs.runtime_run == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: LECTURE_1/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - run: node scripts/prepare-node.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - run: python -m pip install -r ../site/requirements.txt pyinstaller==6.19.0
      - run: python scripts/build-filetools.py
      - run: node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: LECTURE_1/desktop/runtime/${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 5
  package:
    needs: runtime
    if: ${{ always() && (needs.runtime.result == 'success' || (needs.runtime.result == 'skipped' && inputs.runtime_run != '')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            script: pack:win
          - os: macos-15
            platform: darwin
            script: pack:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: LECTURE_1/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-${{ matrix.platform }}-*
          path: LECTURE_1/desktop/build/downloads
          run-id: ${{ inputs.runtime_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Restore runtime permissions
        shell: bash
        run: |
          mkdir -p runtime
          for dir in build/downloads/runtime-*; do cp -R "$dir" "runtime/${dir##*/runtime-}"; done
          if [ "${{ matrix.platform }}" = darwin ]; then
            find runtime -type f \( -name node -o -name attention-files \) -exec chmod +x {} \;
          fi
      - run: npm ci
      - run: node scripts/check-cli.mjs
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged smoke check
        shell: bash
        env:
          ATTENTION_SMOKE_DIR: ${{ github.workspace }}/smoke-output
        run: |
          if [ "${{ matrix.platform }}" = win32 ]; then
            exe="dist/win-unpacked/CODEPLANT ATTENTION.exe"
          else
            exe="dist/mac-universal/CODEPLANT ATTENTION.app/Contents/MacOS/CODEPLANT ATTENTION"
          fi
          "$exe" --smoke-test &
          app_pid=$!
          for i in $(seq 1 90); do
            [ -f "$ATTENTION_SMOKE_DIR/smoke/result.json" ] && break
            sleep 2
          done
          node -e "const r=require(process.env.ATTENTION_SMOKE_DIR+'/smoke/result.json');if(!r.ok)process.exit(1);console.log(r)"
          wait "$app_pid"
          if [ "${{ matrix.platform }}" = darwin ]; then
            lipo -archs "$exe" | grep 'x86_64.*arm64\|arm64.*x86_64'
            export ATTENTION_SMOKE_DIR="$ATTENTION_SMOKE_DIR/intel"
            arch -x86_64 "$exe" --smoke-test &
            app_pid=$!
            for i in $(seq 1 90); do
              [ -f "$ATTENTION_SMOKE_DIR/smoke/result.json" ] && break
              sleep 2
            done
            node -e "const r=require(process.env.ATTENTION_SMOKE_DIR+'/smoke/result.json');if(!r.ok||r.arch!=='x64')process.exit(1);console.log(r)"
            wait "$app_pid"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.platform }}
          path: |
            smoke-output/smoke
            smoke-output/intel/smoke
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: |
            LECTURE_1/desktop/dist/CODEPLANT-ATTENTION-Windows.exe
            LECTURE_1/desktop/dist/CODEPLANT-ATTENTION-Mac.dmg
  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release-files
          merge-multiple: true
      - name: Publish executable files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd release-files
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          gh release create "$TAG" *.exe *.dmg SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ATTENTION Desktop 0.6.0" --notes-file ../LECTURE_1/desktop/RELEASE.md
